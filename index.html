<!DOCTYPE html>
<html lang="pl">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Mapa Europy - tabela i legenda</title>
    <link
      rel="stylesheet"
      href="https://unpkg.com/leaflet@1.9.4/dist/leaflet.css"
      integrity="sha256-p4NxAoJBhIIN+hmNHrzRCf9tD/miZyoHS5obTRR9BMY="
      crossorigin=""
    />
    <link rel="stylesheet" href="styles.css" />
  </head>
  <body>
    <div class="page-wrap">
      <header class="page-header">
        <h1>Interaktywna mapa Europy</h1>
      </header>

      <main class="content">
        <section class="map-panel panel">
          <div class="map-toolbar">
            <button id="reset-values" type="button">Resetuj wartości</button>
          </div>
          <div id="map"></div>
        </section>

        <aside class="sidebar panel">
          <div class="legend">
            <h2>Legenda</h2>
            <div class="legend-item"><span class="swatch swatch-green"></span> 1 - zielony</div>
            <div class="legend-item"><span class="swatch swatch-red"></span> 2 - czerwony</div>
            <div class="legend-item"><span class="swatch swatch-black"></span> 0 - czarny</div>
            <div class="legend-item"><span class="swatch swatch-empty"></span> brak danych - bez koloru</div>
          </div>

          <div class="table-wrap">
            <h2>Dane krajów</h2>
            <table>
              <thead>
                <tr>
                  <th>Kraj</th>
                  <th>Wartość</th>
                </tr>
              </thead>
              <tbody id="country-table-body"></tbody>
            </table>
          </div>
        </aside>
      </main>
    </div>

    <script
      src="https://unpkg.com/leaflet@1.9.4/dist/leaflet.js"
      integrity="sha256-20nQCchB9co0qIjJZRGuk2/Z9VM+kNiyxNV1lvTlZBo="
      crossorigin=""
    ></script>
    <script src="script.js"></script>
  </body>
</html>
